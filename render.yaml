services:
  - type: web
    name: hindirag
    env: python
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openrouter/free
      - key: OPENROUTER_FALLBACK_MODELS
        value: google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,liquid/lfm-2.5-2.6b:free
      - key: OPENROUTER_API_KEY
        sync: false